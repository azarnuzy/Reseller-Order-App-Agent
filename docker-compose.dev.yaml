name: refactor-reseller-app-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: refactor-reseller-app-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reseller_order
    ports:
      - "15432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reseller_order"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_dev_data:

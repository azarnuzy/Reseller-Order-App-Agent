name: refactor-reseller-app

x-app: &app
  build:
    context: .
    target: app
  image: refactor-reseller-app-api

x-server-environment: &server-environment
  NODE_ENV: "${NODE_ENV:-production}"
  API_PORT: "8000"
  API_URL: "${API_URL:-http://api.localhost}"
  PLATFORM_URL: "${PLATFORM_URL:-http://localhost}"
  CLIENT_ORIGINS: "${CLIENT_ORIGINS:-http://localhost}"
  DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/reseller_order?schema=public}"
  INTERNAL_AGENT_API_URL: "${INTERNAL_AGENT_API_URL:-http://api:8000}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  MODEL_PROVIDER: "${MODEL_PROVIDER:-openai}"
  MODEL_NAME: "${MODEL_NAME:-gpt-4.1-mini}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}"
  OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
  LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}"
  LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}"
  LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}"

services:
  caddy:
    build:
      context: .
      target: caddy
      args:
        VITE_API_URL: "${VITE_API_URL:-http://api.localhost}"
    image: refactor-reseller-app-platform
    container_name: refactor-reseller-app-caddy
    restart: unless-stopped
    environment:
      PLATFORM_SITE_ADDRESS: "${PLATFORM_URL:-http://localhost}"
      API_SITE_ADDRESS: "${API_URL:-http://api.localhost}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: refactor-reseller-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reseller_order
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reseller_order"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *app
    container_name: refactor-reseller-app-api
    restart: unless-stopped
    environment:
      <<: *server-environment
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: sh -c "pnpm db:deploy && pnpm --filter @repo/api start"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
